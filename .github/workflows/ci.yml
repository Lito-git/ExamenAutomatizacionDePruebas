# Pipeline de integración continua: build y pruebas automatizadas organizados por stages.
# Se ejecuta en cada push a ramas de trabajo y en cada pull request hacia main.
name: CI

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'docs/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # Stage 1: compila el proyecto; si falla, no se ejecuta ninguna prueba
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: mvn -B clean compile

  # Stage 2: pruebas unitarias (Surefire), solo si el build pasa
  pruebas-unitarias:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas unitarias
        run: mvn -B test

      # Publica los resultados aunque alguna prueba falle
      - name: Publicar reporte de pruebas unitarias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: target/surefire-reports/

  # Stage 3: pruebas de integración (Failsafe), solo si las unitarias pasan
  pruebas-integracion:
    runs-on: ubuntu-latest
    needs: pruebas-unitarias
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas de integración
        run: mvn -B verify -DskipUnitTests=true

      # Publica los resultados aunque alguna prueba falle
      - name: Publicar reporte de pruebas de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-integracion
          path: target/failsafe-reports/