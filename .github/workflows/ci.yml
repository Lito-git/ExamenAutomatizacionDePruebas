# Pipeline de integración y despliegue continuo.
# En pull requests: build y pruebas. En main: además empaqueta la aplicación, la despliega en
# staging, ejecuta el Acceptance Gate y promueve la versión como estable o ejecuta rollback.
name: CI

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'docs/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # Stage 1: compila el proyecto; si falla, no se ejecuta ninguna prueba
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: mvn -B clean compile

  # Stage 2: pruebas unitarias (Surefire), solo si el build pasa
  pruebas-unitarias:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas unitarias
        run: mvn -B test

      # Publica los resultados aunque alguna prueba falle
      - name: Publicar reporte de pruebas unitarias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: target/surefire-reports/

  # Stage 3: pruebas de integración (Failsafe), solo si las unitarias pasan
  pruebas-integracion:
    runs-on: ubuntu-latest
    needs: pruebas-unitarias
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas de integración
        run: mvn -B verify -DskipUnitTests=true

      # Publica los resultados aunque alguna prueba falle
      - name: Publicar reporte de pruebas de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-integracion
          path: target/failsafe-reports/

  # Stage 4: empaqueta la aplicación como imagen Docker versionada (solo en main)
  empaquetado:
    runs-on: ubuntu-latest
    needs: pruebas-integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Nombre de la imagen (en minúsculas) y versión única por ejecución: build-N
      - name: Definir imagen y versión
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "VERSION=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Compilar aplicación
        run: mvn -B clean package -DskipTests

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construye la imagen con su versión y la publica en el registro de artefactos
      - name: Construir y publicar imagen
        run: |
          docker build --build-arg APP_VERSION=$VERSION -t $IMAGEN:$VERSION .
          docker push $IMAGEN:$VERSION

  # Stage 5: despliegue en staging, Acceptance Gate y promoción o rollback (solo en main)
  despliegue-staging:
    runs-on: ubuntu-latest
    needs: empaquetado
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Definir imagen y versión
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "VERSION=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Despliega la nueva versión como contenedor en el ambiente de prueba
      - name: Desplegar en staging
        run: |
          docker pull $IMAGEN:$VERSION
          docker run -d --name login-staging -p 8080:8080 $IMAGEN:$VERSION
          echo "Versión $VERSION desplegada en staging"

      # Espera a que el servicio responda; si no responde, el Acceptance Gate lo detectará
      - name: Esperar disponibilidad del servicio
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8080/salud && exit 0; sleep 1; done
          echo "El servicio no respondió en 30 segundos"

      # Acceptance Gate: escenarios de aceptación contra la versión desplegada
      - name: Acceptance Gate
        env:
          BASE_URL: http://localhost:8080
        run: mvn -B test -Dtest=AceptacionRunner

      - name: Publicar reporte de aceptación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-aceptacion
          path: target/reporte-aceptacion.html

      # Si el gate pasa: la versión se marca como estable (punto de retorno para futuros rollbacks)
      - name: Promover versión como estable
        run: |
          docker tag $IMAGEN:$VERSION $IMAGEN:estable
          docker push $IMAGEN:estable
          echo "Versión $VERSION promovida como estable"

      # Si el gate falla: retira la versión nueva y restaura la última versión estable
      - name: Rollback a la versión estable
        if: failure()
        run: |
          echo "Acceptance Gate fallido: retirando la versión $VERSION de staging"
          docker rm -f login-staging || true
          docker pull $IMAGEN:estable
          docker run -d --name login-staging -p 8080:8080 $IMAGEN:estable
          for i in $(seq 1 30); do curl -sf http://localhost:8080/salud > /dev/null && break; sleep 1; done
          echo "Versión restaurada en staging:"
          curl -sf http://localhost:8080/salud